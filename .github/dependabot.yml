# Config for Dependabot updates. See Documentation here:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Update GitHub actions in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Every weekday
    schedule:
      interval: 'daily'
    groups:
      github-actions:
        patterns:
          - '*'

  # Enable version updates for Docker
  - package-ecosystem: 'docker'
    # Look for a `Dockerfile` in the `compose/local/django` directory
    directories:
      - 'compose/local/django/'
      - 'compose/local/docs/'
      - 'compose/production/django/'
    # Every weekday
    schedule:
      interval: 'daily'
    # Ignore minor version updates (3.10 -> 3.11) but update patch versions
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      docker-python:
        patterns:
          - '*'


  - package-ecosystem: 'docker'
    # Look for a `Dockerfile` in the listed directories
    directories:
      - 'compose/local/node/'
      - 'compose/production/aws/'
      - 'compose/production/postgres/'
      - 'compose/production/traefik/'
      - 'compose/production/nginx/'
    # Every weekday
    schedule:
      interval: 'daily'

  # Enable version updates for Docker Compose files
  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    # Every weekday
    schedule:
      interval: 'daily'

  # Enable version updates for Python/uv
  - package-ecosystem: 'uv'
    # Look for a `pyproject.toml` in the `root` directory
    directory: '/'
    # Every weekday
    schedule:
      interval: 'daily'
    # `ruff` is pinned in TWO places that must move together — `pyproject.toml`
    # and the `ruff-pre-commit` rev in `.pre-commit-config.yaml` — and the uv
    # ecosystem only sees the first, so every ruff bump desyncs the pair (the
    # older --fix hook then strips waivers the newer CI ruff needs). Patch bumps
    # are pure churn against that cost, so they are ignored; anything larger
    # gets its own PR via the `ruff` group below and is always triaged
    # REVIEW NEEDED, because the pre-commit rev must be synced by hand.
    # NOTE: ruff is pre-1.0 and Dependabot uses strict semver, so 0.16 -> 0.17
    # is a *minor* update here, not a major one. Ignoring patch is what actually
    # expresses "only significant ruff releases".
    ignore:
      - dependency-name: 'ruff'
        update-types:
          - 'version-update:semver-patch'
    groups:
      python:
        exclude-patterns:
          - 'ruff'
        update-types:
          - 'minor'
          - 'patch'
      ruff:
        patterns:
          - 'ruff'
