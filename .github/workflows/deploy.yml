name: Deploy

# Three ways in:
#   1. push a `vX.Y.Z` tag           -> test, then deploy that tag (local release cut)
#   2. workflow_dispatch, NEW version -> test, create+push the tag from `ref`, deploy
#                                        (the web-friendly path: no local tag push needed)
#   3. workflow_dispatch, EXISTING    -> skip tests, redeploy the already-tested tag
#                                        (rollback)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag vX.Y.Z. If it already exists it is redeployed (rollback, tests skipped); if new it is created from `ref` after tests pass.'
        required: true
        type: string
      ref:
        description: 'Branch or SHA to tag when cutting a NEW release. Ignored when the tag already exists. Defaults to main.'
        required: false
        default: main
        type: string

# Least privilege by default; only the tag-creation job is granted write.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Dispatch only: validate the version string and decide whether this is a
  # rollback (tag exists) or a new release cut (tag absent -> create from `ref`).
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      exists: ${{ steps.r.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: true
      - id: r
        # GitHub-controlled values arrive via env, never interpolated into the
        # script body — a crafted ref/version could otherwise run as a command.
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION' is not a vX.Y.Z release tag"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

  # Re-run the full dockerized suite before any NEW tag is created or deployed:
  # every pushed tag, and dispatch runs that cut a new release. Rollbacks
  # (dispatch, existing tag) target an already-tested tag and skip this.
  test:
    needs: [resolve]
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && needs.resolve.outputs.exists == 'false'))
    uses: ./.github/workflows/tests.yml

  # Dispatch only, new release: create + push the tag at `ref` AFTER tests pass,
  # so a tag never points at code that failed CI. Pushed with GITHUB_TOKEN, which
  # deliberately does NOT re-trigger the `push: tags` path above — this same run
  # carries on to deploy.
  tag:
    needs: [resolve, test]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.resolve.outputs.exists == 'false' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}   # checkout fails loudly if the ref is missing
      - name: Create and push tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"

  deploy:
    needs: [resolve, test, tag]
    # Deploy when: a pushed tag passed tests; OR a dispatch rollback to an
    # existing tag; OR a dispatch new release whose tag was just created.
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.test.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.resolve.outputs.exists == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.tag.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate tag
        id: tag
        # Pass GitHub-controlled values via env, never interpolated into the
        # script body — a crafted tag name (git permits `$`, backtick, `;`, `(`)
        # would otherwise run as a shell command before the regex below.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_TAG: ${{ needs.resolve.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$RESOLVED_TAG"
          else
            TAG="$REF_NAME"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a vX.Y.Z release tag"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger signed deploy webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: https://webhook.hleroy.com/hooks/rainradar
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BODY=$(printf '{"ref":"%s","sha":"%s"}' "$TAG" "$SHA")
          SIG=$(printf '%s' "$BODY" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" \
            | awk '{print $2}')
          CODE=$(curl -sS -o /dev/stderr -w '%{http_code}' \
            -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=${SIG}" \
            --data "$BODY")
          # 200 means the daemon ACCEPTED the signed request and started
          # deploy.sh asynchronously — NOT that the deploy succeeded. Watch
          # `journalctl -u webhook` on the host for build/migrate results.
          echo "webhook accepted the request (HTTP $CODE); deploy runs async on the host — watch journalctl -u webhook"
          [ "$CODE" = "200" ] || { echo "::error::deploy webhook was not accepted"; exit 1; }
