name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Tests and lint run dockerized for reproducibility — the same containerized
# path as `just pytest` locally. The steps live in the reusable tests.yml so
# CI and the Deploy workflow share one source of truth (no step drift).
jobs:
  ci:
    uses: ./.github/workflows/tests.yml
