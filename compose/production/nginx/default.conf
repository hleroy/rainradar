upstream django {
  server django:5000;
}

# gzip text assets; never gzip png tiles. (text/html is always gzipped by nginx
# and cannot be listed here.)
gzip on;
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml application/manifest+json;
gzip_min_length 256;
gzip_vary on;  # Vary: Accept-Encoding, so intermediaries never mix encodings

# Traefik terminates TLS and proxies from a private docker network, so the TCP
# peer ($remote_addr) is always Traefik's container IP. Recover the real client
# address from X-Forwarded-For — trusting only private-range proxies, walking
# past them recursively — so the per-client limits below key on actual clients
# (and logs/X-Real-IP carry the true address). A client-spoofed XFF prefix is
# ignored: the walk stops at the first untrusted (public) hop.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-client throttles. The JSON API is low-rate by design (a page load is a
# handful of requests; tiles are NOT under /api/ and stay unthrottled), so
# 20 r/s with a small burst is generous for humans and cheap insurance against
# a hammering client. The SSE stream holds an ASGI worker + a Redis pub/sub
# subscription per connection, so cap concurrent streams per client instead.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
# Server-wide circuit breaker for the JSON API (constant key: one shared
# bucket). The per-IP zone above never fires for a surge of *distinct* users;
# this one sheds cleanly with fast 429s in a true overload instead of letting
# request queues melt Django into timeouts. Sized well above normal capacity
# (a page load is ~3 API requests, so 100 r/s sustained ≈ 2k page loads/min).
limit_req_zone "global" zone=api_global:1m rate=100r/s;
limit_req_status 429;
limit_conn_status 429;

server {
  listen       80;
  server_name  _;

  # collectstatic output (frontend/* + admin/*), shared from the django service.
  root /usr/share/nginx/html;

  # API + health are proxied to Django (tiles included).
  # Lightning SSE: long-lived, UNBUFFERED event stream to Django (ASGI). The
  # exact-match location takes precedence over the /api/ prefix below, so this one
  # stream is never buffered while normal /api/ JSON still is. Django also sends
  # X-Accel-Buffering: no as belt-and-suspenders.
  location = /api/lightning/stream {
    limit_conn perip_conn 8;         # a few tabs/devices per IP, not thousands
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";   # keep the upstream connection alive
    proxy_buffering off;              # stream events as they arrive
    proxy_cache off;
    proxy_read_timeout 1h;            # don't time out an idle-but-live stream
    chunked_transfer_encoding off;
  }

  location /api/ {
    limit_req zone=api_rl burst=40 nodelay;
    limit_req zone=api_global burst=200 nodelay;
    # robots.txt stops the crawl; X-Robots-Tag stops the *indexing* of a URL
    # discovered elsewhere (a disallowed URL can still be listed from inbound links).
    add_header X-Robots-Tag "noindex" always;
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /readyz {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Django admin (templates + view) also proxied.
  location /admin/ {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker must be served at root scope to control '/'. no-cache so a new
  # deploy's worker is picked up at once (it then auto-reloads clients).
  # collectstatic copies frontend/sw.js to /usr/share/nginx/html/sw.js.
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    add_header X-Content-Type-Options "nosniff" always;
    default_type text/javascript;
    try_files /sw.js =404;
  }

  # Web app manifest: served from /static with the correct content type so the OS
  # recognises it.
  location = /static/manifest.webmanifest {
    alias /usr/share/nginx/html/manifest.webmanifest;
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
  }

  # Static assets: /static/js/main.js -> /usr/share/nginx/html/js/main.js
  # No content hashing (no build step, native ES modules), so we can't mark these
  # immutable. Instead let the browser cache the bytes but revalidate every load:
  # nginx emits ETag/Last-Modified, so unchanged files return a cheap 304 and a
  # deployed change is picked up immediately — no hard refresh needed.
  location /static/ {
    alias /usr/share/nginx/html/;
    access_log off;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Archived radar tiles: static from the RAID volume (mounted at /data, tiles
  # under /data/tiles), immutable, with a Django fallback for tiles not yet
  # written (recent/empty). Strict regex prevents path traversal.
  # Quoted: nginx requires regexes containing {n} quantifiers to be quoted.
  #
  # The canonical URL is provider-scoped:
  # /tiles/{provider}/{date}/{ts}/{z}/{x}/{y}.png -> /data/tiles/{provider}/… (1:1).
  location ~ "^/tiles/[a-z]+/\d{4}-\d{2}-\d{2}/\d+/\d+/\d+/\d+\.png$" {
    root /data;                 # -> /data/tiles/<provider>/<date>/<ts>/<z>/<x>/<y>.png
    add_header Cache-Control "public, max-age=31536000, immutable";
    # Keep the archive out of image search: these are data, not illustrations, and
    # there are ~1.6 million of them in a full retention window.
    add_header X-Robots-Tag "noindex" always;
    try_files $uri @django_tiles;
    access_log off;
  }
  # Legacy tile URLs — SW-cached old shells still request them. Rewrite them
  # internally into the rainviewer subtree, then the same static+fallback chain applies.
  location ~ "^/tiles/\d{4}-\d{2}-\d{2}/\d+/\d+/\d+/\d+\.png$" {
    rewrite "^/tiles/(\d{4}-\d{2}-\d{2}/\d+/\d+/\d+/\d+\.png)$" /tiles/rainviewer/$1 last;
  }
  location @django_tiles {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /metrics is public by design: it exposes only non-sensitive operational
  # gauges/counters (frame/strike counts, storage bytes, poll/WS state). The
  # former allow-list was ineffective anyway — behind Traefik, $remote_addr is
  # Traefik's private container IP, so "deny all" never fired.
  location = /metrics {
    add_header X-Robots-Tag "noindex" always;
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Standalone layers explainer on a short URL, French (/apropos) and English
  # (/about). Plain static documents (collectstatic copies frontend/apropos.html and
  # frontend/about.html next to the shell), served with the same hardening as / but a
  # *tighter* CSP: unlike the app they load nothing cross-origin, open no connection
  # and spawn no worker, so they need neither the OSM image host nor blob: workers.
  # Their CSS/JS/fonts/images are ordinary /static/ assets, which is why they need no
  # inline-script or data: font exemption.
  #
  # One regex block for both — an exact-match pair would duplicate the header set,
  # and a header that drifts between the two languages is the failure worth
  # designing out. Regex locations are matched before the `location /` prefix, and
  # the alternation is anchored, so nothing else can fall in here.
  location ~ ^/(apropos|about)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    default_type text/html;
    try_files /$1.html =404;
  }

  # Crawler-facing files. Both are plain static documents under the root (collectstatic
  # copies frontend/robots.txt and frontend/sitemap.xml next to the shell). They need
  # explicit locations: without them they fall into the catch-all below and 404 — and
  # before that change they were answered with index.html as text/html, which is how a
  # site ends up with no robots.txt at all. Cached briefly; they change once a year.
  # `types { }` empties the mime map for the location so `default_type` actually
  # decides: left to mime.types, sitemap.xml would go out as text/xml, which drifts
  # from what Django serves in dev. Both types are valid; agreeing is worth more.
  location = /robots.txt {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    types { }
    default_type text/plain;
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    types { }
    default_type application/xml;
    try_files /sitemap.xml =404;
  }

  # SPA entrypoint. Never cache the HTML shell: it's tiny and must always be
  # fetched fresh so a deploy's new asset references take effect at once.
  #
  # EXACT match, deliberately. This used to be a `location /` prefix ending in
  # `try_files /index.html =404` — a try_files that can never fall through, so every
  # unknown URL answered 200 with the app shell. That is a soft 404: it hands crawlers
  # an unbounded supply of duplicate pages, and it swallowed /robots.txt. The app has
  # no client-side routing (no History API anywhere in frontend/js), so `/` is the only
  # document URL there is and everything else genuinely does not exist. The service
  # worker's navigation branch is network-first, so a real 404 reaches the browser
  # unchanged.
  #
  # Security headers live here on the document (Django's SecurityMiddleware only
  # covers proxied responses, not this static shell). The CSP is strict because
  # the app qualifies: no inline scripts/styles, ES modules + assets from self,
  # images additionally from the OSM tile hosts, and blob: workers for the
  # WebCodecs muxer (mediabunny spawns Workers from blob: URLs). It is the
  # backstop for the one HTML-bearing data path (the backend attribution strings
  # fed to Leaflet's attribution control). The inline ld+json block in index.html is
  # an HTML data block, never prepared for execution, so script-src does not reach it.
  location = / {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Mirrors Django's SECURE_REFERRER_POLICY: OSM's tile servers reject
    # requests whose Referer was stripped entirely (see config/settings/base.py).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files /index.html =404;
  }

  # Everything not matched above does not exist. Terminal, and last.
  location / {
    add_header X-Robots-Tag "noindex" always;
    return 404;
  }
}
