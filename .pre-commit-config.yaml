exclude: '/migrations/|vendor/'
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: detect-private-key
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.30.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Linter
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.24.1
    hooks:
      - id: pyproject-fmt

  # Enforce Conventional Commits on commit messages. Runs on the commit-msg
  # stage (not pre-commit), so it needs a one-time setup:
  #   pre-commit install --hook-type commit-msg
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, chore, docs, test, style, perf, ci, build, revert]

  # Secret scanning with Gitleaks. Scans only staged changes (fast, pre-commit
  # appropriate). The tracked .envs/.local/* files hold dev-only placeholders
  # and are allowlisted in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Gitleaks secret scan (staged)
        args:
          - --config=.gitleaks.toml

  # Full test suite before pushing — a local safety net mirroring the CI pytest
  # job (linting alone won't catch broken tests). Scoped to pre-push so it never
  # runs per-commit. Runs dockerized (Postgres + Redis), never on the host.
  # One-time setup:  pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite, pre-push)
        entry: docker compose -f docker-compose.local.yml run --rm django pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip:
    # Gitleaks uses golang and needs network to resolve modules; skip on CI.
    - gitleaks
    # pytest needs the Docker stack; it runs locally (pre-push) and in the CI
    # pytest job, not in pre-commit.ci.
    - pytest
  submodules: false
