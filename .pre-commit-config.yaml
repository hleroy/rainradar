exclude: '/migrations/|vendor/'
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: detect-private-key
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.33.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '6.0']

  # Ruff linter + formatter, run from the project's own pin. ruff is pinned ONCE,
  # in pyproject.toml / uv.lock — the same version CI lints with — so the hook can
  # never drift from CI. (We used to pull astral-sh/ruff-pre-commit at its own
  # `rev:`, a second pin Dependabot kept bumping on its own.) `--only-group dev`
  # installs just the dev tools, not the app (psycopg[c] needs a compiler).
  # Hook definitions mirror upstream ruff-pre-commit's.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group dev ruff check --force-exclude
        args: [--fix, --exit-non-zero-on-fix]
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt

  # Enforce Conventional Commits on commit messages. Runs on the commit-msg
  # stage (not pre-commit), so it needs a one-time setup:
  #   pre-commit install --hook-type commit-msg
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, chore, docs, test, style, perf, ci, build, revert]

  # Secret scanning with Gitleaks. Scans only staged changes (fast, pre-commit
  # appropriate). The tracked .envs/.local/* files hold dev-only placeholders
  # and are allowlisted in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks secret scan (staged)
        args:
          - --config=.gitleaks.toml

  # Full test suite before pushing — a local safety net mirroring the CI pytest
  # job (linting alone won't catch broken tests). Scoped to pre-push so it never
  # runs per-commit. Runs dockerized (Postgres + Redis), never on the host.
  # One-time setup:  pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite, pre-push)
        entry: docker compose -f docker-compose.local.yml run --rm django pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
